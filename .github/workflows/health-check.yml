name: Endpoint Health Check

on:
  workflow_run:
    workflows: ["Build and Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BASE_URL: https://stephenlyons.dev

jobs:
  health-check:
    name: Endpoint Health Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Wait for GitHub Pages propagation
        # Give Pages up to 60 seconds to publish the new build before probing
        run: sleep 60

      - name: Check endpoints
        id: check
        run: |
          # Pages live at their directory URLs (R19: /about/, never /about, which Pages answers
          # with a 301). A missing path must get the real 404 page. "path expected-status".
          ENDPOINTS=(
            "/ 200"
            "/about/ 200"
            "/projects/ 200"
            "/contact/ 200"
            "/no/such/page/ 404"
          )

          FAIL=0
          printf "%-30s %-8s %-12s\n" "Endpoint" "Status" "Time (ms)"
          printf "%-30s %-8s %-12s\n" "--------" "------" "---------"

          for entry in "${ENDPOINTS[@]}"; do
            read -r path EXPECTED <<< "$entry"
            URL="${BASE_URL}${path}"
            RESULT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" \
              --max-time 15 --connect-timeout 10 "$URL")
            STATUS=$(echo "$RESULT" | awk '{print $1}')
            TIME_S=$(echo "$RESULT" | awk '{print $2}')
            TIME_MS=$(echo "$TIME_S * 1000" | bc | xargs printf "%.0f")

            if [[ "$STATUS" == "$EXPECTED" ]]; then
              ICON="✅"
            else
              ICON="❌"
              FAIL=1
            fi

            printf "%s %-28s %-8s %-12s\n" "$ICON" "$path" "$STATUS" "${TIME_MS}ms"
          done

          if [[ "$FAIL" -eq 1 ]]; then
            echo ""
            echo "One or more endpoints returned an unexpected status."
            exit 1
          fi

          echo ""
          echo "All endpoints healthy."
