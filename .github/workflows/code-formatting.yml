# =============================================================================
# Automated Code Formatting Check with Prettier
# =============================================================================
# Purpose: Enforce consistent code style across HTML, CSS, and JavaScript files.
#          Consistent formatting improves readability, reduces merge conflicts,
#          and makes code review more efficient.
#
# How it works:
# - On every pull request, Prettier checks all HTML, CSS, and JS files.
# - If any files don't match the expected format, the workflow fails with
#   a clear diff showing what needs to be fixed.
# - Developers can auto-fix locally: npx prettier --write .
#
# To configure Prettier:
# - Add a .prettierrc file to the repo root for custom rules
# - Add a .prettierignore file to exclude specific files/directories
#
# Documentation: https://prettier.io/docs/en/cli.html
# =============================================================================

name: Code Formatting

on:
  pull_request:
    # Check formatting on all PRs
    paths:
      # Only run when relevant files change
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - ".prettierrc"
      - ".prettierignore"

# Minimal permissions — only needs to read code
permissions:
  contents: read

jobs:
  prettier:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Check out the PR branch
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js for running Prettier
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Install Prettier
      # Using npx to avoid needing a package.json, but pinning the version
      # for reproducible builds
      - name: Install Prettier
        run: npm install --global prettier@3

      # Step 4: Run Prettier in check mode
      # --check flag exits with a non-zero code if any file is not formatted
      # This provides a clear diff of what needs to change
      - name: Check formatting
        run: |
          echo "Checking code formatting with Prettier..."
          prettier --check "**/*.{html,css,js}" || {
            echo ""
            echo "==========================================="
            echo "  CODE FORMATTING CHECK FAILED"
            echo "==========================================="
            echo ""
            echo "Some files are not formatted correctly."
            echo "Run the following command locally to fix:"
            echo ""
            echo "  npx prettier --write ."
            echo ""
            echo "Then commit and push the changes."
            echo "==========================================="
            exit 1
          }

      # Step 5: Success message
      - name: Formatting passed
        run: echo "✅ All files are properly formatted!"
