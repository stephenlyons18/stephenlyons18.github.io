# =============================================================================
# Secret Scanning with TruffleHog
# =============================================================================
# Purpose: Scan all commits and pull requests for accidentally committed
#          secrets such as API keys, tokens, passwords, and other credentials.
#
# How it works:
# - On every push to main/master and every pull request, TruffleHog scans
#   the git history for high-entropy strings, known secret patterns, and
#   regex-matched credentials.
# - If any secrets are detected, the workflow fails immediately, preventing
#   sensitive data from reaching the main branch.
# - On pull requests, findings are annotated directly on the PR for easy review.
#
# Documentation: https://github.com/trufflesecurity/trufflehog
# =============================================================================

name: Secret Scanning

on:
  push:
    branches:
      - main
      - master
  pull_request:
    # Scan all PRs regardless of target branch

# Limit permissions to minimum required
permissions:
  contents: read
  pull-requests: write  # Needed to annotate PRs with findings

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Check out the repository with full history
      # TruffleHog needs the complete git history to scan all commits
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      # Step 2: Run TruffleHog to scan for secrets
      # - Scans the entire git history on push events
      # - Scans only the PR diff on pull request events
      # - Fails the workflow if any verified secrets are found
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan the full repo on push, or just the PR diff
          extra_args: --only-verified
          # The action automatically detects push vs PR context

      # Step 3: Post a summary comment (informational)
      - name: Scan Summary
        if: always()
        run: |
          echo "::notice::TruffleHog secret scanning completed."
          echo "If this step failed, review the TruffleHog output above for detected secrets."
          echo "Remove any secrets from git history using 'git filter-branch' or BFG Repo-Cleaner."
          echo "Rotate any exposed credentials immediately."
