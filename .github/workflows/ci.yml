name: CI

# Gate for main only. Work merged into dev / revamp is checked locally (CLAUDE.md, "Done means"),
# so Actions minutes are spent once per release PR, not on every merge. Skipped when a PR touches
# neither the site nor the workflows.
on:
  pull_request:
    branches: [main]
    paths:
      - 'astro-portfolio/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: astro-portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: astro-portfolio/package.json

      # pnpm store cached, keyed to the lockfile: unchanged deps aren't re-downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: astro-portfolio/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Audit — critical fails the build
        run: pnpm audit --audit-level critical

      # One high advisory (http-cache-semantics via astro) has no patched release yet — warn, don't fail.
      - name: Audit — high warns
        run: |
          pnpm audit --audit-level high || echo "::warning::high-severity advisories present (issue #20)"

      - name: Unit tests
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Chromium cached per Playwright version; on a hit only the OS libraries are installed.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium OS dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E (desktop, laptop, mobile)
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            astro-portfolio/playwright-report/
            astro-portfolio/test-results/
          retention-days: 7
