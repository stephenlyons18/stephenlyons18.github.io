name: Format Code (Prettier)

on:
  workflow_run:
    workflows: ["Build and Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prettier:
    name: Prettier Format
    runs-on: ubuntu-latest
    # Only run after a successful deploy (skip on PR builds that don't deploy)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the commit push works correctly
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: astro-portfolio/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: astro-portfolio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: astro-portfolio

      # Config lives in astro-portfolio/.prettierrc.json; `pnpm format` is the same command used locally.
      - name: Run Prettier
        run: pnpm format
        working-directory: astro-portfolio

      - name: Commit formatted files (if any changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style: auto-format with Prettier [skip ci]"
            git push origin main
          fi
