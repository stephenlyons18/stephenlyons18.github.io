name: Build and Deploy to GitHub Pages

# Triggers: push/PR to main, and a manual "Run workflow" button in the
# GitHub Actions UI (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deploys — if a new push arrives while a deploy is in
# progress the new run queues instead of force-cancelling the current one,
# keeping the build branch in a known-good state at all times.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Opt into Node.js 24 now (becomes mandatory on June 2 2026 / removed Sep 16 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default token scope for all jobs unless overridden at job level.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Build
  # Runs on every push AND on pull requests (so PRs get a status check).
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache npm's dependency cache keyed to the lock file so subsequent
          # runs skip re-downloading packages that haven't changed.
          cache: 'npm'
          cache-dependency-path: astro-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro-portfolio

      - name: Build site
        # Runs: esbuild → astro build → postbuild.mjs (path relativisation)
        run: npm run build
        working-directory: astro-portfolio

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          # Keying the artifact name to the commit SHA prevents collisions
          # when multiple workflow runs overlap.
          name: dist-${{ github.sha }}
          path: astro-portfolio/dist/
          # CRITICAL: include-hidden-files defaults to false in upload-artifact@v4,
          # which silently drops dotfiles like .nojekyll.  Without .nojekyll in the
          # build branch, GitHub Pages runs Jekyll and strips _astro/ (all CSS+JS).
          include-hidden-files: true
          # Keep artifacts for 7 days so you can inspect past builds.
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Deploy
  # Only runs after a successful build AND only on pushes/manual triggers
  # (not on pull requests — PRs only get the build status check above).
  #
  # Uses `git worktree` — the proper way to work with a second branch —
  # so `git add --all` stages ALL files (including dotfiles like
  # .nojekyll) without any GIT_WORK_TREE / GIT_INDEX_FILE trickery that
  # silently skips dotfiles.
  #
  # .nojekyll MUST be in the build branch.  Without it GitHub Pages runs
  # Jekyll, which silently strips every file/folder starting with _ —
  # including _astro/ — which removes all compiled CSS and framework JS.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to build branch
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy to build branch via git worktree
        id: deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── Configure git identity & auth ──────────────────────────────
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # ── Record rollback anchor ─────────────────────────────────────
          ROLLBACK_SHA=""
          BRANCH_EXISTS=false
          if git ls-remote --exit-code origin build >/dev/null 2>&1; then
            git fetch origin build --depth=1
            ROLLBACK_SHA=$(git rev-parse origin/build)
            BRANCH_EXISTS=true
          fi
          echo "rollback-sha=${ROLLBACK_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch-existed=${BRANCH_EXISTS}" >> "$GITHUB_OUTPUT"

          # ── Create a git worktree for the build branch ─────────────────
          # RUNNER_TEMP is outside the source repo so the source repo's
          # .gitignore cannot interfere with what gets staged.
          DEPLOY_DIR="${RUNNER_TEMP}/build-worktree"
          if [ "$BRANCH_EXISTS" = "true" ]; then
            git worktree add "$DEPLOY_DIR" origin/build
          else
            # First deploy: create an orphan branch (no shared history with main)
            git worktree add --orphan -b build "$DEPLOY_DIR"
          fi

          # ── Wipe previous content from the worktree ───────────────────
          git -C "$DEPLOY_DIR" rm -rf . 2>/dev/null || true
          git -C "$DEPLOY_DIR" clean -fdx 2>/dev/null || true

          # ── Copy ALL dist/ contents including dotfiles (.nojekyll etc.) ─
          # cp -a preserves permissions and copies hidden files.
          cp -a "${GITHUB_WORKSPACE}/dist/." "$DEPLOY_DIR/"

          # ── Defense-in-depth: ensure .nojekyll is always present ───────
          # Without it GitHub Pages runs Jekyll and silently strips _astro/.
          # This is a no-op if the file was already copied from dist/.
          touch "$DEPLOY_DIR/.nojekyll"

          # ── Stage everything ───────────────────────────────────────────
          git -C "$DEPLOY_DIR" add --all

          # ── Sanity-check that .nojekyll was staged ─────────────────────
          # Without .nojekyll GitHub Pages runs Jekyll and strips _astro/,
          # removing all CSS + JS and breaking the entire deployed site.
          if ! git -C "$DEPLOY_DIR" ls-files | grep -qF '.nojekyll'; then
            echo "::error::.nojekyll was NOT staged — aborting deploy to prevent broken release"
            git -C "$DEPLOY_DIR" ls-files
            exit 1
          fi
          echo "::notice::.nojekyll confirmed present in staged files"

          # ── Commit ─────────────────────────────────────────────────────
          MSG="deploy: ${{ github.event.head_commit.message || 'manual trigger' }} (${{ github.sha }})"
          if git -C "$DEPLOY_DIR" diff --cached --quiet; then
            echo "::notice::Nothing changed — skipping push"
          else
            git -C "$DEPLOY_DIR" commit -m "$MSG"
            git -C "$DEPLOY_DIR" push origin HEAD:refs/heads/build
            echo "::notice::Successfully deployed to branch 'build'"
          fi

          # ── Remove worktree ────────────────────────────────────────────
          git worktree remove --force "$DEPLOY_DIR" 2>/dev/null || true

      # ── Rollback ───────────────────────────────────────────────────────
      - name: Rollback to previous build on failure
        if: failure() && steps.deploy.outputs.branch-existed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "::warning::Deployment failed — rolling back build branch to ${{ steps.deploy.outputs.rollback-sha }}"
          git push origin "${{ steps.deploy.outputs.rollback-sha }}:refs/heads/build" --force
          echo "::notice::Rollback complete. build branch restored to ${{ steps.deploy.outputs.rollback-sha }}"
