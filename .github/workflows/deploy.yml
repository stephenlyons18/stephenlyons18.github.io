name: Build and Deploy to GitHub Pages

# Triggers: push/PR to main, and a manual "Run workflow" button in the
# GitHub Actions UI (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deploys — if a new push arrives while a deploy is in
# progress the new run queues instead of force-cancelling the current one,
# keeping the build branch in a known-good state at all times.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Opt into Node.js 24 now (becomes mandatory on June 2 2026 / removed Sep 16 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Build
  # Runs on every push AND on pull requests (so PRs get a status check).
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache npm's dependency cache keyed to the lock file so subsequent
          # runs skip re-downloading packages that haven't changed.
          cache: 'npm'
          cache-dependency-path: astro-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro-portfolio

      - name: Build site
        # Runs: esbuild → astro build → postbuild.mjs (path relativisation)
        run: npm run build
        working-directory: astro-portfolio

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          # Keying the artifact name to the commit SHA prevents collisions
          # when multiple workflow runs overlap.
          name: dist-${{ github.sha }}
          path: astro-portfolio/dist/
          # Keep artifacts for 7 days so you can inspect past builds.
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Deploy
  # Only runs after a successful build AND only on pushes/manual triggers
  # (not on pull requests — PRs only get the build status check above).
  #
  # Uses pure git plumbing to push dist/ to the build branch so every
  # file — including dotfiles like .nojekyll — is reliably deployed.
  # .nojekyll prevents GitHub Pages from running Jekyll, which would
  # otherwise silently strip every file/folder starting with _ (including
  # _astro/) and break all CSS and framework JS.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to build branch
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to push to the build branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy to build branch via git
        id: deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── Configure git identity ──────────────────────────────────────
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Authenticate pushes with the built-in Actions token
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # ── Record rollback anchor (HEAD of build branch if it exists) ──
          ROLLBACK_SHA=""
          BRANCH_EXISTS=false
          if git ls-remote --exit-code origin build >/dev/null 2>&1; then
            git fetch origin build
            ROLLBACK_SHA=$(git rev-parse origin/build)
            BRANCH_EXISTS=true
          fi
          echo "rollback-sha=${ROLLBACK_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch-existed=${BRANCH_EXISTS}" >> "$GITHUB_OUTPUT"

          # ── Build a tree object from dist/ using a scratch index ────────
          # GIT_WORK_TREE tells git to treat dist/ as the root, so paths in
          # the index become index.html, _astro/foo.css, .nojekyll, etc.
          # GIT_INDEX_FILE must NOT be a pre-existing empty file — git parses
          # the path as an existing index and fails with "smaller than expected"
          # on a 0-byte file.  mktemp gives us a unique path; we delete the
          # empty placeholder immediately so git creates a fresh valid index.
          TMPIDX=$(mktemp)
          rm -f "$TMPIDX"   # remove the 0-byte placeholder; git will create a fresh index here
          GIT_INDEX_FILE="$TMPIDX" GIT_WORK_TREE="${GITHUB_WORKSPACE}/dist" \
            git add --all
          TREE=$(GIT_INDEX_FILE="$TMPIDX" git write-tree)
          rm -f "$TMPIDX"

          # ── Create commit (chained onto build branch history if it exists)
          MSG="deploy: ${{ github.event.head_commit.message || 'manual trigger' }} (${{ github.sha }})"
          if [ "$BRANCH_EXISTS" = "true" ]; then
            COMMIT=$(git commit-tree "$TREE" -p origin/build -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi

          # ── Push ────────────────────────────────────────────────────────
          git push origin "${COMMIT}:refs/heads/build"
          echo "::notice::Deployed commit ${COMMIT} to branch 'build'"

      # ── Rollback: if the push failed and the branch previously existed,
      #    force-restore it to the last known-good SHA. ───────────────────
      - name: Rollback to previous build on failure
        if: failure() && steps.deploy.outputs.branch-existed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "::warning::Deployment failed — rolling back build branch to ${{ steps.deploy.outputs.rollback-sha }}"
          git push origin "${{ steps.deploy.outputs.rollback-sha }}:refs/heads/build" --force
          echo "::notice::Rollback complete. build branch restored to ${{ steps.deploy.outputs.rollback-sha }}"
