name: Build and Deploy to GitHub Pages

# Triggers: push/PR to main, and a manual "Run workflow" button in the
# GitHub Actions UI (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deploys — if a new push arrives while a deploy is in
# progress the new run queues instead of force-cancelling the current one,
# keeping the build branch in a known-good state at all times.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Build
  # Runs on every push AND on pull requests (so PRs get a status check).
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache npm's dependency cache keyed to the lock file so subsequent
          # runs skip re-downloading packages that haven't changed.
          cache: 'npm'
          cache-dependency-path: astro-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro-portfolio

      - name: Build site
        # Runs: esbuild → astro build → postbuild.mjs (path relativisation)
        run: npm run build
        working-directory: astro-portfolio

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          # Keying the artifact name to the commit SHA prevents collisions
          # when multiple workflow runs overlap.
          name: dist-${{ github.sha }}
          path: astro-portfolio/dist/
          # Keep artifacts for 7 days so you can inspect past builds.
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Deploy
  # Only runs after a successful build AND only on pushes/manual triggers
  # (not on pull requests — PRs only get the build status check above).
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to build branch
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to push to the build branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all branches so we can resolve origin/build for rollback.
          fetch-depth: 0

      # Record the current HEAD of the build branch BEFORE we touch it.
      # If anything goes wrong after this point we can restore this SHA.
      - name: Record previous build branch HEAD (rollback anchor)
        id: prev
        run: |
          if git ls-remote --exit-code origin build >/dev/null 2>&1; then
            SHA=$(git rev-parse origin/build)
            echo "sha=$SHA"        >> "$GITHUB_OUTPUT"
            echo "exists=true"     >> "$GITHUB_OUTPUT"
          else
            echo "sha="            >> "$GITHUB_OUTPUT"
            echo "exists=false"    >> "$GITHUB_OUTPUT"
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy to build branch
        id: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: build
          folder: dist
          # Include the triggering commit message + SHA in the deploy commit
          # for traceability.
          commit-message: >-
            deploy: ${{ github.event.head_commit.message || 'manual trigger' }}
            (${{ github.sha }})
          # Keep full history on the build branch so rollbacks are always
          # possible — do not squash into a single orphan commit.
          single-commit: false
          # Remove stale files from previous builds (e.g. renamed or deleted
          # pages), keeping the branch clean.
          clean: true

      # If the deploy step itself failed AND the build branch previously
      # existed, force-push the last known-good SHA back to restore it.
      # This guards against partial writes or push failures leaving the
      # build branch in a broken state.
      - name: Rollback to previous build on failure
        if: failure() && steps.prev.outputs.exists == 'true'
        run: |
          echo "::warning::Deployment failed — rolling back build branch to ${{ steps.prev.outputs.sha }}"
          git push origin "${{ steps.prev.outputs.sha }}:refs/heads/build" --force
          echo "::notice::Rollback complete. build branch restored to ${{ steps.prev.outputs.sha }}"
