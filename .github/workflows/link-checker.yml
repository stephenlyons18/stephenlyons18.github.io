# =============================================================================
# Broken Link Checker
# =============================================================================
# Purpose: Scan all HTML files for broken internal and external links.
#          Broken links erode user trust and harm SEO. This workflow catches
#          link rot early so it can be fixed promptly.
#
# How it works:
# - Runs on a weekly schedule (every Monday at 9 AM UTC) and on every push
#   to the main branch.
# - Uses lychee, a fast link checker written in Rust, to validate all
#   links found in HTML files.
# - If broken links are detected, the workflow creates a GitHub Issue with
#   a detailed report of all failures.
#
# Configuration:
# - Exclude patterns can be added for known-flaky URLs (e.g., localhost)
# - Timeout and retry settings can be adjusted below
#
# Documentation: https://github.com/lycheeverse/lychee-action
# =============================================================================

name: Link Checker

on:
  # Run weekly on Mondays at 9:00 AM UTC
  schedule:
    - cron: "0 9 * * 1"

  # Also run on pushes to main
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.md"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Permissions needed to create issues for broken link reports
permissions:
  contents: read
  issues: write

jobs:
  linkchecker:
    name: Check Broken Links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Run lychee link checker
      # lychee is a fast, async link checker that validates both internal
      # and external links in HTML, Markdown, and other file types.
      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan all HTML files in the repository
          args: >-
            --verbose
            --no-progress
            --accept 100..=399
            --timeout 30
            --max-retries 3
            --max-concurrency 10
            --exclude "localhost"
            --exclude "127\\.0\\.0\\.1"
            --exclude "example\\.com"
            --exclude "formspree\\.io"
            "**/*.html"
            "**/*.md"
          # Fail the workflow if broken links are found
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Create a GitHub Issue if broken links are found
      # This makes it easy to track and fix link rot over time
      - name: Create Issue for broken links
        if: failure() && steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Broken Links Detected"
          content-filepath: ./lychee/out.md
          labels: |
            bug
            automated
            link-checker
          assignees: ""

      # Step 4: Summary output
      - name: Link check summary
        if: always()
        run: |
          if [ "${{ steps.lychee.outcome }}" = "success" ]; then
            echo "✅ All links are valid!"
          else
            echo "❌ Broken links were detected. A GitHub Issue has been created."
            echo "Review the issue and fix or update the broken links."
          fi
